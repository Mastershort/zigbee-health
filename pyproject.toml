[project]
name = "zigbee-health"
version = "0.10.0"
description = "Home Assistant custom integration that analyses the health of a Zigbee2MQTT network."
requires-python = ">=3.13"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["custom_components/zigbee_health/analyzer"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "C4", "DTZ", "TC"]
ignore = [
    "PLR0911", # rule functions return early on purpose
    "PLR0912",
    "PLR0913",
    "PLR2004", # magic values are fine in tests and in documented thresholds
    "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "DTZ001", "PT018", "TC"]

[tool.ruff.lint.isort]
known-first-party = ["analyzer", "builders", "custom_components"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
explicit_package_bases = true
